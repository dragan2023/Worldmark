<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Worldmark 共创者名单</title>
<style>
  :root {
    --bg: #f6f8fa;
    --card: #ffffff;
    --border: #d0d7de;
    --text: #1f2328;
    --muted: #57606a;
    --accent: #2b6cb0;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "Segoe UI", "Microsoft YaHei", "PingFang SC", sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
    padding: 24px 16px 48px;
  }
  .wrap { max-width: 720px; margin: 0 auto; }
  header {
    background: linear-gradient(135deg, #2b6cb0, #3182ce);
    color: #fff;
    border-radius: 12px;
    padding: 28px 24px;
    margin-bottom: 24px;
  }
  header h1 { font-size: 24px; margin-bottom: 6px; }
  header p { opacity: 0.9; font-size: 14px; }
  .meta {
    font-size: 13px;
    color: var(--muted);
    margin: 12px 2px 16px;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 8px 0;
  }
  .contributor {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 20px;
    border-bottom: 1px solid #eaeef2;
  }
  .contributor:last-child { border-bottom: none; }
  .avatar {
    width: 40px; height: 40px;
    border-radius: 50%;
    background: #e8eef6;
    color: var(--accent);
    font-weight: 600;
    display: flex; align-items: center; justify-content: center;
    font-size: 16px;
    flex-shrink: 0;
    border: 1px solid var(--border);
  }
  .info { flex: 1; min-width: 0; }
  .username {
    font-weight: 600;
    color: var(--accent);
    text-decoration: none;
    word-break: break-all;
  }
  .username:hover { text-decoration: underline; }
  .sub { font-size: 12px; color: var(--muted); }
  .count {
    background: #dbeafe;
    color: #1e40af;
    border-radius: 999px;
    padding: 3px 10px;
    font-size: 13px;
    font-weight: 600;
    white-space: nowrap;
  }
  .empty {
    text-align: center;
    padding: 48px 20px;
    color: var(--muted);
  }
  .empty .big { font-size: 40px; margin-bottom: 12px; }
  .empty a { color: var(--accent); }
  footer {
    text-align: center;
    font-size: 12px;
    color: var(--muted);
    margin-top: 24px;
  }
  footer a { color: var(--accent); }
  .error { color: #b91c1c; text-align: center; padding: 32px 16px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🌏 Worldmark 共创者名单</h1>
    <p>IP 地标旅游应用 · 感谢每一位共创者的贡献</p>
  </header>

  <div class="meta" id="meta">名单加载中…</div>
  <div class="card" id="list">
    <div class="empty"><div class="big">⏳</div>正在读取共创者名单…</div>
  </div>

  <footer>
    数据来源：<a href="https://github.com/dragan2023/Worldmark/blob/main/data/contributions/contributors.json" target="_blank" rel="noopener">contributors.json</a> ·
    <a href="https://github.com/dragan2023/Worldmark" target="_blank" rel="noopener">Worldmark 项目主页</a>
  </footer>
</div>

<script>
async function loadContributors() {
  const meta = document.getElementById('meta');
  const list = document.getElementById('list');
  try {
    const resp = await fetch('./contributors.json', { cache: 'no-store' });
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    const data = await resp.json();
    const contributors = Array.isArray(data.contributors) ? data.contributors : [];

    meta.textContent = '共 ' + contributors.length + ' 位共创者';

    if (contributors.length === 0) {
      list.innerHTML = '<div class="empty"><div class="big">🌱</div>' +
        '还没有共创者，欢迎成为第一位！<br><br>' +
        '<a href="https://github.com/dragan2023/Worldmark/blob/main/docs/共创贡献规范.md" target="_blank" rel="noopener">查看如何参与共创 →</a></div>';
      return;
    }

    list.innerHTML = '';
    for (const c of contributors) {
      const username = c.username || '未知用户';
      const initial = username.slice(0, 1).toUpperCase();
      const url = c.github_url || ('https://github.com/' + username);
      const count = Number(c.merged_entries || 0);

      const row = document.createElement('div');
      row.className = 'contributor';
      row.innerHTML =
        '<div class="avatar">' + escapeHtml(initial) + '</div>' +
        '<div class="info">' +
          '<a class="username" href="' + url + '" target="_blank" rel="noopener">@' + escapeHtml(username) + '</a>' +
          '<div class="sub">' + escapeHtml(url.replace(/^https?:\/\//, '')) + '</div>' +
        '</div>' +
        '<div class="count">' + count + ' 条</div>';
      list.appendChild(row);
    }
  } catch (err) {
    meta.textContent = '加载失败';
    list.innerHTML = '<div class="error">名单加载失败：' + escapeHtml(String(err && err.message || err)) + '</div>';
  }
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, function (ch) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch];
  });
}

loadContributors();
</script>
</body>
</html>
