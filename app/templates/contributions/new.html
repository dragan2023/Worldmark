<!doctype html>
<html lang="zh-CN">
  <head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{{ title }}</title>
    <link rel="icon" href="/static/favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="/static/css/site.css"><link rel="stylesheet" href="/static/css/contributions.css"></head>
  <body>{% include "_header.html" %}<main class="contribution-shell">
    <a class="back-link" href="/">← 返回首页</a><p class="eyebrow">COMMUNITY CONTRIBUTION</p><h1>提交一个 IP 地标</h1><p class="intro">提交会先进入候选审核队列，不会直接公开。请填写你的署名和可访问来源；登录后的提交会自动关联账号，便于后续开放共创权限。</p>
    <form class="contribution-form" data-contribution-form>
      <fieldset><legend>共创者</legend><label>署名 <input name="contributor_name" maxlength="100" required placeholder="显示在已发布条目的共创者栏"></label></fieldset>
      <fieldset><legend>条目</legend><div class="form-grid"><label>门类 <select name="ip_type" required><option value="literature">文学</option><option value="game">游戏</option><option value="screen">影视剧</option></select></label><label>作品名称 <input name="work_title" maxlength="255" required></label><label>地标名称 <input name="landmark_name" maxlength="255" required></label><label>地标类型 <input name="landmark_kind" maxlength="100" placeholder="如：拍摄地、现实原型"></label></div></fieldset>
      <fieldset><legend>现实位置</legend><div class="form-grid"><label>国家/地区代码 <input name="country_code" maxlength="2" required placeholder="如 CN"></label><label>国家/地区 <input name="country_name" maxlength="100" required placeholder="如 中国"></label><label>省/州 <input name="province_name" maxlength="100"></label><label>城市 <input name="city_name" maxlength="100"></label></div><label>详细地址 <input name="normalized_address" maxlength="500" required placeholder="省/州 + 城市 + 区/县 + 街道门牌（或景区入口）"></label></fieldset>
      <fieldset><legend>作品关联与来源</legend><label>地标简介 <textarea name="description" rows="8" required placeholder="在作品中的重要地位：&#10;主要出现的情节：&#10;现实地标介绍："></textarea></label><label>来源链接 <input name="source_url" type="url" required placeholder="https://..."></label><div class="form-grid"><label>来源机构/作者 <input name="source_publisher" maxlength="255"></label><label>来源标题 <input name="source_title" maxlength="500"></label></div></fieldset>
      <p class="form-notice">请只提交原创简介和可核验地点信息；不要填写联系方式、剧照、游戏截图或来源不明图片。</p><button type="submit">提交并记录署名</button><p class="form-result" data-contribution-result role="status"></p>
    </form>
  </main><script src="/static/js/contribution-form.js"></script></body>
</html>
