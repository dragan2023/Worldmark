<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{ title }}</title>
    <link rel="icon" href="/static/favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="/static/css/site.css"><link rel="stylesheet" href="/static/css/itinerary.css"></head><body>{% include "_header.html" %}<main class="itinerary-shell"><a class="back-link" href="/">← 返回首页</a><p class="eyebrow">PREMIUM ITINERARY</p><div class="page-title"><h1>我的个性化行程</h1><a class="primary-button" href="/itineraries/new">生成新行程</a></div>{% if items %}<section class="itinerary-list">{% for item in items %}<article><p>{{ item.start_date }} 至 {{ item.end_date }} · v{{ item.version }}</p><h2><a href="/itineraries/{{ item.id }}">{{ item.title }}</a></h2><p>状态：{{ item.status }}</p></article>{% endfor %}</section>{% else %}<section class="empty-state"><h2>还没有行程</h2><p>选择已发布的 IP 地标和出行偏好，生成一份可编辑、可导出的草案。</p></section>{% endif %}</main></body></html>
