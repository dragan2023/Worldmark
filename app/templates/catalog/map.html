{% extends "base.html" %}
{% block styles %}<link rel="stylesheet" href="/static/css/catalog.css"><link rel="stylesheet" href="/static/css/map.css?v=3"><link rel="stylesheet" href="/static/vendor/leaflet/leaflet.css">{% endblock %}
{% block content %}
    <main class="catalog-shell">
      <a class="back-link" href="{{ catalog_url }}">← 返回目录</a>
      <h1>{{ module_name }}静态参考地图</h1>
      <p class="map-notice">地图只用于参考地标分布，不提供实时导航、交通或位置追踪。在右侧搜索可过滤列表与标记，点击作品或地标可快速定位。</p>
      <div class="map-layout">
        <div id="landmark-map" data-api-url="{{ map_api_url }}" data-tile-url="{{ map_tile_url }}" aria-label="地标静态地图"></div>
        <aside class="map-locate" aria-label="地标快速定位">
          <div class="map-locate-head">
            <label class="visually-hidden" for="map-locate-search">搜索作品或地标</label>
            <input type="search" id="map-locate-search" placeholder="搜索作品或地标…" autocomplete="off">
            <button type="button" id="map-locate-reset">重置</button>
          </div>
          <p class="map-locate-count" id="map-locate-count" role="status" aria-live="polite"></p>
          <ul class="map-locate-list" id="map-locate-list"></ul>
        </aside>
      </div>
      <p class="map-attribution">地图瓦片 © <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener noreferrer">OpenStreetMap contributors</a>。</p>
      <p class="map-status" id="map-status" role="status" aria-live="polite"></p>
    </main>
{% endblock %}
{% block scripts %}
    <script src="/static/vendor/leaflet/leaflet.js"></script>
    <script src="/static/js/landmark-map.js?v=3"></script>
{% endblock %}
