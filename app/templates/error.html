{% extends "base.html" %}
{% block styles %}<link rel="stylesheet" href="/static/css/catalog.css">{% endblock %}
{% block content %}
    <main class="page-shell error-page">
      <p class="eyebrow">ERROR {{ status_code }}</p>
      <h1>{{ title }}</h1>
      <p class="intro">{{ message }}</p>
      <p class="error-actions">
        {% if status_code == 403 %}
        <a class="primary-button" href="/intake">参与共创</a>
        <a class="secondary-button" href="/contributions">我的贡献</a>
        {% elif status_code == 401 %}
        <a class="primary-button" href="/login">去登录</a>
        {% endif %}
        <a class="contribution-link" href="/">← 返回首页</a>
      </p>
    </main>
{% endblock %}
