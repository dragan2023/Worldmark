<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{{ title }}</title>
    <link rel="icon" href="/static/favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="/static/css/site.css"><link rel="stylesheet" href="/static/css/auth.css">
  </head>
  <body>
    {% include "_header.html" %}
    <main class="page-shell auth-shell">
      <p class="eyebrow">会员账户</p>
      <h1>登录</h1>
      <p class="page-lead">登录后可使用一键入库、相册管理与个性化行程等功能。</p>
      <form id="login-form" class="auth-form">
        <label class="auth-label" for="login-username">用户名</label>
        <input class="auth-input" type="text" id="login-username" name="username" required autocomplete="username"
          placeholder="你的账户名（英文/数字/下划线）">
        <label class="auth-label" for="login-password">密码</label>
        <input class="auth-input" type="password" id="login-password" name="password" required autocomplete="current-password"
          placeholder="你的密码">
        <button type="submit" class="primary-button auth-submit">登录</button>
        <p id="login-error" class="form-error" role="alert"></p>
        <p class="auth-switch">还没有账号？<a href="/register">立即注册</a></p>
      </form>
    </main>
    {% include "_footer.html" %}
    <script src="/static/js/auth.js"></script>
  </body>
</html>
