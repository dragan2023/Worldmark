name: probe-secret-owner
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: 查看 Secret 归属账号（仅打印 login，不打印 token）
        run: |
          curl -s -H "Authorization: Bearer ${{ secrets.WORLDMARK_ADMIN_TOKEN }}" https://api.github.com/user | jq -r '"SECRET_OWNER=" + .login'
